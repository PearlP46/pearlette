<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% if page.title %}{{ page.title | escape }} · {% endif %}pearlette</title><meta name="description" content="{{ page.excerpt | default: site.description | strip_html | strip_newlines | escape }}"><meta property="og:title" content="{{ page.title | default: site.title | escape }}"><meta property="og:description" content="{{ site.description | escape }}"><link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml"><link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}"></head><body>{% include header.html %}<main id="main" class="container">{{ content }}</main>{% include footer.html %}</body></html>
